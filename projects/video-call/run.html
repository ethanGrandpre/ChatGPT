<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../member-session.js"></script><script data-shared-session="true" src="../../project-sync.js"></script><script src="../../appearance.js"></script><link rel="stylesheet" href="../../appearance.css"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../project-kit.css"><link rel="stylesheet" href="call.css"><title>Video Call — Dock</title></head><body><div class="call-app"><header><a href="index.html">← Video Call</a><button id="theme" aria-label="Switch theme">◐</button></header><main><div class="heading"><div><h1>Face to face.</h1><p>One room. Two people.</p></div><span id="state" class="pill">Not in a call</span></div><div class="room-controls"><button id="create" class="primary">Create room</button><button id="copy" disabled>Copy invite link</button><button id="join" disabled>Join room</button><button id="leave" class="danger" disabled>Leave</button></div><p id="status" role="status">Create a room or open an invite link.</p><div class="videos"><section><video id="remote" autoplay playsinline></video><span id="remote-label">Waiting for the other person</span><button id="play" hidden>Play call audio</button></section><section class="self"><video id="local" autoplay muted playsinline></video><span>You</span></section></div><div class="media-controls"><label><input id="mic" type="checkbox" checked> Microphone</label><label><input id="camera" type="checkbox" checked> Camera</label></div><p id="network" class="note"></p><p class="note">Only people signed in to Dock with this room link can join. Calls are not recorded. Leaving stops this device’s camera and microphone.</p></main></div><script type="module" src="call.js"></script></body></html>
