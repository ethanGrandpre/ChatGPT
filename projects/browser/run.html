<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser</title><link rel="stylesheet" href="browser.css"></head><body><div class="browser"><header><a class="brand" href="index.html" title="Back to project">dock <span>browser</span></a><div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" title="New tab" aria-label="New tab">+</button></header><form id="navigation" class="toolbar"><button id="back" type="button" title="Back" aria-label="Back">←</button><button id="forward" type="button" title="Forward" aria-label="Forward">→</button><button id="reload" type="button" title="Reload" aria-label="Reload">↻</button><input id="address" aria-label="Search or enter address" placeholder="Search or enter address" autocomplete="off"><button id="go" type="submit">Go</button><button id="bookmark" type="button" title="Bookmark page" aria-label="Bookmark page">☆</button><button id="bookmarks-button" type="button" title="Bookmarks" aria-label="Bookmarks">☰</button><button id="theme" type="button" title="Switch theme" aria-label="Switch theme">◐</button><a id="external" href="https://www.google.com" target="_blank" rel="noopener noreferrer">Open externally ↗</a></form><div class="notice"><span id="status" role="status">Ready</span><span>Some websites block embedded browsing. Use Open externally if a page is blank or refused.</span></div><main id="views"></main><aside id="bookmarks" hidden><div class="panel-head"><strong>Bookmarks</strong><button id="close-bookmarks" aria-label="Close bookmarks">×</button></div><div id="saved"></div></aside></div><script type="module" src="browser.js"></script></body></html>
