<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../appearance.js"></script><link rel="stylesheet" href="../../appearance.css"><title>Tasks</title><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="tasks.css"></head><body><div class="task-app"><header class="task-header"><a href="index.html">← Tasks project</a><div><button id="export-tasks" class="secondary">Export</button><button id="import-tasks" class="secondary">Import</button><input id="import-file" type="file" accept="application/json" hidden><button id="toggle-theme" class="icon-button" aria-label="Switch theme">◐</button></div></header><main><div class="title-line"><div><div class="eyebrow">ONE THING AT A TIME</div><h1>Make a little progress.</h1><p class="subtitle" id="summary">Your next step starts here.</p></div></div><section class="notification-panel" aria-label="Task notifications"><div><strong>Device reminders</strong><p id="notification-status" role="status">Checking notification support…</p></div><div class="actions"><button id="enable-notifications" class="secondary">Enable notifications</button><button id="test-notification" class="secondary" disabled>Send test</button><button id="disable-notifications" class="secondary" hidden>Disable</button></div></section><form id="quick-add"><label class="sr-only" for="task-title">New task</label><input id="task-title" required maxlength="200" placeholder="What do you want to get done?" autocomplete="off"><button class="primary">+ Add task</button></form><div class="task-tools"><nav aria-label="Filter tasks"><button class="active" data-filter="all">All</button><button data-filter="active">Active</button><button data-filter="today">Due today</button><button data-filter="done">Done</button></nav><button id="clear-done">Clear done</button></div><div class="task-search"><input id="task-search" type="search" aria-label="Search tasks" placeholder="Search tasks…"><select id="task-sort" aria-label="Sort tasks"><option value="newest">Newest first</option><option value="priority">Priority</option><option value="due">Due date</option></select></div><div id="task-list" aria-label="Tasks"></div><p class="local-note">Saved on this device · Export a backup to move tasks to another device</p></main></div><dialog id="task-dialog"><form id="edit-task"><div class="modal-head"><h2>Edit task</h2><button id="close-edit" type="button" aria-label="Close editor">×</button></div><label>Task<input name="title" required maxlength="200"></label><div class="form-row"><label>Status<select name="status" aria-label="Task status"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></label><label>Priority<select name="priority" aria-label="Task priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div><label>Due date<input name="due" type="date"></label><label>Remind me<input name="reminder" type="datetime-local"><span class="muted">Uses this device’s time zone. Enable device notifications above. Changes need an internet connection to sync.</span></label><label>Notes<textarea name="notes" maxlength="5000" placeholder="Add some context…"></textarea></label><div class="modal-actions"><button id="delete-task" class="secondary danger" type="button">Delete</button><button id="cancel-edit" class="secondary" type="button">Cancel</button><button class="primary">Save task</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="tasks.js"></script></body></html>
