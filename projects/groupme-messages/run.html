<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../project-sync.js"></script><script src="../../appearance.js"></script><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../appearance.css"><link rel="stylesheet" href="messages.css"><title>GroupMe Messages</title></head><body><div class="chat-app"><header><a href="index.html">← GroupMe</a><button id="theme" aria-label="Switch theme">◐</button></header><div class="chat-layout"><aside><h1 id="list-title">Groups</h1><nav class="conversation-tabs" aria-label="Conversation type"><button id="tab-groups" aria-pressed="true">Groups</button><button id="tab-dms" aria-pressed="false">DMs</button></nav><p id="account">Not connected</p><input id="search" type="search" placeholder="Find a conversation" aria-label="Find a conversation"><div id="groups"></div><button id="more-groups" hidden>More conversations</button><button id="refresh-groups">Connect / refresh</button></aside><main><div class="chat-head"><h2 id="title">Choose a conversation</h2><button id="refresh" disabled>Refresh</button></div><p id="status" role="status">Starting GroupMe Messages…</p><small id="live-status" role="status">Live · checks every 5 sec</small><small id="release">Client: groupme-dms-readonly-1</small><a id="setup" href="index.html">Access token setup →</a><button id="older" hidden>Earlier messages</button><div id="messages" aria-label="Conversation" tabindex="0"></div><p id="dm-note" hidden>DMs are read-only. GroupMe does not allow sending direct messages through its Developer API.</p><form id="compose" hidden><label for="text">Message</label><p id="send-status" role="status"></p><textarea id="text" maxlength="1000" rows="3" placeholder="Write a message…" disabled></textarea><div><span>Text only · Messages update automatically</span><button id="send" class="primary" disabled>Send</button></div></form></main></div></div><script type="module">try{await import('./messages.js')}catch{document.getElementById('status').textContent='GroupMe could not start. Reload the page or use Connect GroupMe.'}</script></body></html>
