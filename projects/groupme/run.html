<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../project-sync.js"></script><script src="../../appearance.js"></script><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../appearance.css"><link rel="stylesheet" href="groupme.css"><title>GroupMe</title></head><body><div class="chat-app"><header><a href="index.html">← GroupMe</a><button id="theme" aria-label="Switch theme">◐</button></header><div class="chat-layout"><aside><h1>Groups</h1><input id="search" type="search" placeholder="Find a group" aria-label="Find a group"><div id="groups"></div><button id="more-groups" hidden>More groups</button><button id="refresh-groups">Refresh groups</button></aside><main><div class="chat-head"><h2 id="title">Choose a group</h2><button id="refresh" disabled>Refresh</button></div><p id="status" role="status">Loading groups…</p><a id="setup" href="index.html">Access token setup →</a><button id="older" hidden>Earlier messages</button><div id="messages" aria-label="Conversation" tabindex="0"></div><form id="compose"><label for="text">Message</label><textarea id="text" maxlength="1000" rows="3" placeholder="Write a message…" disabled></textarea><div><span>Text only · Refresh for new messages</span><button id="send" class="primary" disabled>Send</button></div></form></main></div></div><script type="module">try{await import('./groupme.js')}catch{document.getElementById('status').textContent='GroupMe could not start. Reload the page or use Connect GroupMe.'}</script></body></html>
