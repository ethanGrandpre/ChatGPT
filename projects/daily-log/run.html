<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Log</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../project-kit.css"><style>.log-layout{display:grid;grid-template-columns:180px 1fr;gap:32px}.day-list{border-right:1px solid var(--line);padding-right:18px}.day-list button{display:block;text-align:left;width:100%;padding:9px;border-radius:5px;font-size:11px}.day-list button.active{background:var(--hover)}.date-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:22px}.date-bar button{padding:8px}.save-line{display:flex;justify-content:space-between;align-items:center;margin:15px 0}#notes{min-height:230px}.day-empty{font-size:11px;color:var(--muted);padding:12px 0}@media(max-width:650px){.log-layout{grid-template-columns:1fr}.day-list{border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;display:flex;overflow:auto;gap:5px}.day-list button{flex-shrink:0;width:auto}.date-bar{gap:4px}}</style></head><body><div class="tool-app"><header class="tool-header"><a href="index.html">← Daily Log</a><div class="actions"><button id="backup" class="secondary">Export backup</button><button id="restore" class="secondary">Import</button><input id="file" type="file" accept="application/json" hidden><button data-theme-toggle class="icon-button" aria-label="Switch theme">◐</button></div></header><main><div class="title-line"><div><div class="eyebrow">NOTICE THE SMALL THINGS</div><h1>Your day, a little clearer.</h1><p class="subtitle">A focus. A few notes. Something worth remembering.</p></div></div><div class="date-bar"><button id="previous" aria-label="Previous day">←</button><input id="date" type="date" aria-label="Entry date"><button id="next" aria-label="Next day">→</button><button id="today" class="secondary">Today</button><span id="weekday" class="muted"></span></div><div class="log-layout"><nav id="days" class="day-list" aria-label="Saved days"></nav><section><label for="focus">One thing to focus on</label><input id="focus" maxlength="240" placeholder="What matters most today?"><div class="tool-grid"><div><label for="wins">Small wins</label><textarea id="wins" maxlength="10000" placeholder="What went well?"></textarea></div><div><label for="next-step">Next step</label><textarea id="next-step" maxlength="10000" placeholder="Make tomorrow a little easier."></textarea></div></div><label for="notes">Notes</label><textarea id="notes" maxlength="40000" placeholder="A thought, a reflection, a place to think…"></textarea><div class="save-line"><span id="saved" class="muted" role="status">Ready</span><div class="actions"><button id="export-day" class="secondary">Export this day</button><button id="clear" class="secondary">Clear day</button></div></div></section></div><p class="tool-note">Saved automatically on this device. Dates use your device’s local calendar. Export a backup before clearing browser data.</p></main></div><script type="module" src="log.js"></script></body></html>
