name: Deploy private Cloudflare workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-private
  cancel-in-progress: true
jobs:
  deploy:
    # Enable after Cloudflare Access, Turnstile, and Worker secrets are configured.
    if: vars.PRIVATE_HOSTING_READY == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:private
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
