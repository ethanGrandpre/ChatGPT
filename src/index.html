<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="appearance.js"></script><link rel="stylesheet" href="appearance.css">
  <meta name="theme-color" content="#ffffff">
  <title>Dock — Projects</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header class="topbar">
      <a class="brand" href="./" id="brandname">dock</a>
      <div class="header-actions">
        <a class="account-link" id="account" href="/_security/logout" hidden title="Sign out">Sign out</a>
        <button class="icon-button" id="theme-toggle" aria-label="Switch to dark mode" title="Switch theme"></button>
        <button class="icon-button" id="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 3-.7 2.2-2 .9-2.2-.5-2 3.4 1.5 1.7v2.5L2.1 15l2 3.4 2.2-.5 2 .9L9 21h4l.7-2.2 2-.9 2.2.5 2-3.4-1.5-1.8v-2.5L19.9 9l-2-3.4-2.2.5-2-.9L13 3Z"/><circle cx="11" cy="12" r="3"/></svg></button>
      </div>
    </header>
    <main>
      <div class="title-line"><h1>Projects <span id="project-count"></span></h1><button class="primary" id="new-project">+ Add project</button></div>
      <p class="hub-hint">Open a project for details, or use Run to launch it.</p>
      <div class="quick-filters" aria-label="Project views"><button data-view="All projects" class="active">All</button><button data-view="Favorites">Favorites</button><button data-view="Recently opened">Recently opened</button><button id="collections-shortcut">Collections</button></div>
      <div class="toolbar">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Search projects" aria-label="Search projects"><kbd>/</kbd></label>
        <select id="collection-filter" aria-label="Filter collection"></select>
        <select id="sort-projects" aria-label="Sort projects"><option value="custom">Custom order</option><option value="name">Name A–Z</option><option value="recent">Last opened</option></select>
      </div>
      <div class="results-bar"><span id="results-count" role="status"></span><button id="clear-filters" hidden>Clear filters</button></div>
      <div id="projects" class="project-list" aria-label="Projects"></div>
      <p id="discovery-label" class="discovery-status" role="status"></p>
    </main>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
