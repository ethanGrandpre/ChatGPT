<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="appearance.js"></script><link rel="stylesheet" href="appearance.css"><title>Project folder — Dock</title><link rel="stylesheet" href="style.css"><body><main style="max-width:800px;padding:60px 25px"><a href="./">← Back to Dock</a><div class="eyebrow" style="margin-top:40px">PROJECT FOLDER</div><h1 id="name">Project</h1><p id="description" class="subtitle"></p><div id="files" style="margin-top:35px"></div><p style="color:var(--muted);font-size:12px;margin-top:30px">Add an index.html or a deployed URL in project.json to launch this project as an app.</p></main><script type="module">const id=new URLSearchParams(location.search).get('id');const data=await fetch('projects.json').then(r=>r.json());const p=data.find(p=>p.id===id);if(p){document.title=p.name+' — Dock';document.querySelector('#name').textContent=p.name;document.querySelector('#description').textContent=p.description;for(const f of p.files){const a=document.createElement('a');a.textContent='↳ '+f;a.href='projects/'+encodeURIComponent(p.id)+'/'+encodeURIComponent(f);a.style.cssText='display:block;padding:15px;border-bottom:1px solid var(--line)';document.querySelector('#files').append(a)}}else document.querySelector('#name').textContent='Project not found';</script></body></html>
